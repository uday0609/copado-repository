<template>
   <lightning-input type="text" label="Task Title" name="title" onchange={handleChange}></lightning-input>
   <lightning-combobox name="progress" label="Status" value={value} placeholder="Select Progress" options={options} onchange={handleChange} ></lightning-combobox> 
    <lightning-button variant="base" label="Add to List" onclick={handleClick}></lightning-button>

    <lightning-datatable key-field="title" data={list} columns={columns}></lightning-datatable>
</template>
