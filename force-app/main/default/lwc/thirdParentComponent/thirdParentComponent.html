<template>
      <lightning-input type="name" name="firstName" data-id="first-name" label="First Name" placeholder="Enter your first name" onchange={handleChange}></lightning-input>

      <c-third-child-component first-name = {first} last-name = {last} ></c-third-child-component>
</template>
