<template>
    <lightning-card variant="narrow">
        <div slot="title" class="slds-media slds-media_center">
            <div class="slds-media__figure">
                <lightning-avatar 
                    src="/assets/images/logo.png" initials="AC" fallback-icon-name="standard:account" variant="brand" size="large"></lightning-avatar>
            </div>
            <div class="slds-media__body">
                <p class="slds-text-body_small slds-line-height_reset">Account</p>
                <h1 class="slds-page-header__title slds-m-right_small slds-align-middle slds-truncate">{name}</h1>
            </div>
        </div>
        <div slot="actions">
            <lightning-button-group>
                <lightning-button label="New" data-name="new" onclick={handleClick}></lightning-button>
                <lightning-button label="Edit" data-name="edit" onclick={handleClick}></lightning-button>
                <lightning-button label="View" data-name="view" onclick={handleClick}></lightning-button>
            </lightning-button-group>
        </div>
        <template lwc:if={accountRecordMode}>
            <div class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCancel}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-record-form record-id={dynamicRecordId} object-api-name={objectApiName} layout-type="Full" mode={dynamicMode} columns="2" onsuccess={handleSuccess} oncancel={handleCancel}></lightning-record-form>
                    </div>
                    <template lwc:if={isViewMode}>
                        <div class="slds-modal__footer">
                            <lightning-button label="Close" variant="neutral" onclick={handleCancel}></lightning-button>
                        </div>
                    </template>
                </div>
            </div>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
        
        <div class="slds-grid slds-page-header__row_gutters slds-m-top_medium slds-p-horizontal_medium">
            <template for:each={headerFields} for:item="field">
                <div key={field.id} class="slds-page-header__col-details">
                    <p class="slds-text-title_caps slds-truncate" title={field.label}>{field.label}</p>
                    <p class="slds-text-body_regular slds-truncate" title={field.value}>{field.value}</p>
                </div>
            </template>
        </div>

        <div class="slds-p-around_small slds-border_top slds-m-top_medium">
            <lightning-tabset variant="scoped">
                <lightning-tab label={labels.contactTab} data-id="Contact" onactive={handleTabChange}></lightning-tab>
                <lightning-tab label={labels.opportunityTab} data-id="Opportunity" onactive={handleTabChange}></lightning-tab>
                <lightning-tab label={labels.casesTab} data-id="Case" onactive={handleTabChange}></lightning-tab>
                <lightning-tab label={labels.taskTab} data-id="Task" onactive={handleTabChange}></lightning-tab>
            </lightning-tabset>

            <div class="slds-m-top_medium">
                <div class="slds-grid slds-grid_vertical-align-center slds-m-vertical_small">
                    <div class="slds-col">
                        <span class="slds-badge">Total Records: {totalRecords}</span>
                    </div>
                    <div class="slds-col_bump-left">
                        <lightning-button label={dynamicButtonLabel} variant="neutral" onclick={handleNewRecordClick}></lightning-button>
                    </div>
                </div>

                <template lwc:if={isRelatedModalOpen}>
                    <div class="slds-modal slds-fade-in-open">
                        <div class="slds-modal__container">
                            <div class="slds-modal__header">
                                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeRelatedModal}>
                                    <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                                </button>
                                <h2 class="slds-modal__title slds-hyphenate">New {relatedObjectApiName}</h2>
                            </div>
                            <div class="slds-modal__content slds-p-around_medium">
                                <lightning-record-form object-api-name={relatedObjectApiName} layout-type="Compact" mode="edit" columns="2" onsuccess={handleRelatedSuccess} oncancel={closeRelatedModal}></lightning-record-form>
                            </div>
                        </div>
                    </div>
                </template>
                <div>
                    <lightning-datatable key-field="Id" data={dynamicData} columns={dynamicColumns} show-row-number-column hide-checkbox-column onrowselection={handleRowSelection}></lightning-datatable>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
